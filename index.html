<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Encuentra especialistas médicos verificados y elige con confianza."
    />
    <meta name="theme-color" content="#f7f9f8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <script>
      (() => {
        const saved = localStorage.getItem("caresync-theme");
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.background =
          theme === "dark" ? "#0f211d" : "#f7f9f8";
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0f211d" : "#f7f9f8";
      })();
    </script>
    <title>CareSync</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
